<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial,sans-serif">
  <rect width="900" height="500" fill="#f0f2f5"/>
  <defs><filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/></filter></defs>

  <!-- Top navbar -->
  <rect width="900" height="48" fill="#875A7B"/>
  <text x="20" y="30" font-size="16" fill="white" font-weight="bold">Odoo</text>
  <text x="80" y="30" font-size="13" fill="rgba(255,255,255,0.8)">WhatsApp ▸ Configuration ▸ Channels</text>

  <!-- Three panels side by side -->

  <!-- PANEL 1: Contacts -->
  <rect x="10" y="58" width="276" height="430" rx="8" fill="white" filter="url(#sh)"/>
  <rect x="10" y="58" width="276" height="44" rx="8" fill="#25D366"/>
  <rect x="10" y="88" width="276" height="14" fill="#25D366"/>
  <text x="148" y="83" font-size="13" fill="white" text-anchor="middle" font-weight="bold">👥 Contacts Sync</text>

  <!-- Sync button -->
  <rect x="28" y="114" width="240" height="34" rx="4" fill="#075E54"/>
  <text x="148" y="135" font-size="13" fill="white" text-anchor="middle" font-weight="bold">🔄 Sync Contacts</text>

  <!-- Contact list -->
  <text x="28" y="170" font-size="11" fill="#667781">50 contacts synced</text>
  <rect x="28" y="178" width="240" height="1" fill="#eee"/>

  <!-- contacts -->
  <rect x="28" y="186" width="32" height="32" rx="16" fill="#128C7E"/>
  <text x="44" y="207" font-size="13" fill="white" text-anchor="middle">A</text>
  <text x="70" y="199" font-size="12" fill="#333" font-weight="bold">Ahmed Hassan</text>
  <text x="70" y="214" font-size="10" fill="#667781">+966 55 336 8212</text>

  <rect x="28" y="226" width="240" height="1" fill="#eee"/>
  <rect x="28" y="234" width="32" height="32" rx="16" fill="#e17055"/>
  <text x="44" y="255" font-size="13" fill="white" text-anchor="middle">M</text>
  <text x="70" y="247" font-size="12" fill="#333" font-weight="bold">Mohamed Khalid</text>
  <text x="70" y="262" font-size="10" fill="#667781">+966 50 123 4567</text>

  <rect x="28" y="274" width="240" height="1" fill="#eee"/>
  <rect x="28" y="282" width="32" height="32" rx="16" fill="#6c5ce7"/>
  <text x="44" y="303" font-size="13" fill="white" text-anchor="middle">S</text>
  <text x="70" y="295" font-size="12" fill="#333" font-weight="bold">Sara Al-Rashid</text>
  <text x="70" y="310" font-size="10" fill="#667781">+966 54 987 6543</text>

  <rect x="28" y="322" width="240" height="1" fill="#eee"/>
  <text x="148" y="348" font-size="11" fill="#aaa" text-anchor="middle">+ 47 more contacts...</text>

  <!-- Auto-sync note -->
  <rect x="20" y="382" width="258" height="96" rx="6" fill="#e8f5e9"/>
  <text x="36" y="402" font-size="11" fill="#2e7d32" font-weight="bold">⏰ Auto-sync via Cron</text>
  <text x="36" y="420" font-size="10" fill="#2e7d32">• Chats: every 15 minutes</text>
  <text x="36" y="436" font-size="10" fill="#2e7d32">• Contacts: hourly (optional)</text>
  <text x="36" y="452" font-size="10" fill="#2e7d32">• Webhooks: real-time</text>
  <text x="36" y="468" font-size="10" fill="#2e7d32">Go to Settings › Technical › Scheduled Actions</text>

  <!-- PANEL 2: Groups -->
  <rect x="310" y="58" width="276" height="430" rx="8" fill="white" filter="url(#sh)"/>
  <rect x="310" y="58" width="276" height="44" rx="8" fill="#128C7E"/>
  <rect x="310" y="88" width="276" height="14" fill="#128C7E"/>
  <text x="448" y="83" font-size="13" fill="white" text-anchor="middle" font-weight="bold">🫂 Groups Sync</text>

  <rect x="328" y="114" width="240" height="34" rx="4" fill="#075E54"/>
  <text x="448" y="135" font-size="13" fill="white" text-anchor="middle" font-weight="bold">🔄 Sync Groups</text>

  <text x="328" y="170" font-size="11" fill="#667781">8 groups synced</text>
  <rect x="328" y="178" width="240" height="1" fill="#eee"/>

  <!-- Group item 1 -->
  <rect x="328" y="186" width="32" height="32" rx="6" fill="#25D366"/>
  <text x="344" y="207" font-size="14" fill="white" text-anchor="middle">👥</text>
  <text x="372" y="199" font-size="12" fill="#333" font-weight="bold">Sales Team 2025</text>
  <text x="372" y="214" font-size="10" fill="#667781">12 participants</text>

  <rect x="328" y="226" width="240" height="1" fill="#eee"/>
  <rect x="328" y="234" width="32" height="32" rx="6" fill="#e17055"/>
  <text x="344" y="255" font-size="14" fill="white" text-anchor="middle">👥</text>
  <text x="372" y="247" font-size="12" fill="#333" font-weight="bold">Support Channel</text>
  <text x="372" y="262" font-size="10" fill="#667781">5 participants</text>

  <rect x="328" y="274" width="240" height="1" fill="#eee"/>
  <rect x="328" y="282" width="32" height="32" rx="6" fill="#6c5ce7"/>
  <text x="344" y="303" font-size="14" fill="white" text-anchor="middle">👥</text>
  <text x="372" y="295" font-size="12" fill="#333" font-weight="bold">VIP Customers</text>
  <text x="372" y="310" font-size="10" fill="#667781">23 participants</text>

  <rect x="328" y="322" width="240" height="1" fill="#eee"/>
  <text x="448" y="348" font-size="11" fill="#aaa" text-anchor="middle">+ 5 more groups...</text>

  <!-- Check phones box -->
  <rect x="320" y="382" width="258" height="96" rx="6" fill="#e3f2fd"/>
  <text x="336" y="402" font-size="11" fill="#1565c0" font-weight="bold">📞 Check Phone Numbers</text>
  <text x="336" y="420" font-size="10" fill="#1565c0">Validate if a phone number has</text>
  <text x="336" y="436" font-size="10" fill="#1565c0">an active WhatsApp account.</text>
  <text x="336" y="452" font-size="10" fill="#1565c0">Go to: Configuration › Check Phones</text>
  <text x="336" y="468" font-size="10" fill="#1565c0">Enter numbers (one per line) › Check</text>

  <!-- PANEL 3: API Logs -->
  <rect x="610" y="58" width="278" height="430" rx="8" fill="white" filter="url(#sh)"/>
  <rect x="610" y="58" width="278" height="44" rx="8" fill="#875A7B"/>
  <rect x="610" y="88" width="278" height="14" fill="#875A7B"/>
  <text x="749" y="83" font-size="13" fill="white" text-anchor="middle" font-weight="bold">📋 API Logs</text>

  <text x="628" y="120" font-size="11" fill="#667781">Configuration › API Logs (managers only)</text>

  <!-- Log entries -->
  <rect x="618" y="130" width="262" height="50" rx="4" fill="#f8f9fa"/>
  <rect x="618" y="130" width="4" height="50" fill="#25D366" rx="2"/>
  <text x="632" y="146" font-size="11" fill="#333" font-weight="bold">GET /chats</text>
  <text x="632" y="160" font-size="10" fill="#667781">200 OK · 0.34s · 10:32:01</text>
  <text x="632" y="174" font-size="10" fill="#aaa">20 chats returned</text>

  <rect x="618" y="190" width="262" height="50" rx="4" fill="#f8f9fa"/>
  <rect x="618" y="190" width="4" height="50" fill="#25D366" rx="2"/>
  <text x="632" y="206" font-size="11" fill="#333" font-weight="bold">POST /messages/text</text>
  <text x="632" y="220" font-size="10" fill="#667781">200 OK · 0.52s · 10:29:44</text>
  <text x="632" y="234" font-size="10" fill="#aaa">Message sent to Ahmed</text>

  <rect x="618" y="250" width="262" height="50" rx="4" fill="#f8f9fa"/>
  <rect x="618" y="250" width="4" height="50" fill="#e17055" rx="2"/>
  <text x="632" y="266" font-size="11" fill="#333" font-weight="bold">GET /contacts</text>
  <text x="632" y="280" font-size="10" fill="#e17055">429 Too Many Requests · 09:58</text>
  <text x="632" y="294" font-size="10" fill="#aaa">Rate limit hit — auto-retry</text>

  <rect x="618" y="310" width="262" height="50" rx="4" fill="#f8f9fa"/>
  <rect x="618" y="310" width="4" height="50" fill="#25D366" rx="2"/>
  <text x="632" y="326" font-size="11" fill="#333" font-weight="bold">POST /webhook/register</text>
  <text x="632" y="340" font-size="10" fill="#667781">200 OK · 0.28s · 09:15:02</text>
  <text x="632" y="354" font-size="10" fill="#aaa">Webhook registered successfully</text>

  <!-- QR Login note -->
  <rect x="618" y="382" width="262" height="96" rx="6" fill="#fce4ec"/>
  <text x="634" y="402" font-size="11" fill="#c62828" font-weight="bold">📱 QR Code Login</text>
  <text x="634" y="420" font-size="10" fill="#c62828">If not already connected, use</text>
  <text x="634" y="436" font-size="10" fill="#c62828">Channel form › QR Login button</text>
  <text x="634" y="452" font-size="10" fill="#c62828">to scan QR with your WhatsApp</text>
  <text x="634" y="468" font-size="10" fill="#c62828">mobile app and link the channel.</text>

  <!-- Step label -->
  <rect x="0" y="482" width="900" height="18" fill="#e8f5e9"/>
  <text x="450" y="494" font-size="11" fill="#2e7d32" text-anchor="middle">STEP 5 — Sync Contacts &amp; Groups manually or let the scheduler run · Check API Logs for debugging · Use QR Login if needed</text>
</svg>
