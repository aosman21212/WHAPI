<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial,sans-serif">
  <!-- Background -->
  <rect width="900" height="520" fill="#f0f2f5"/>

  <!-- Top navbar -->
  <rect width="900" height="48" fill="#875A7B"/>
  <text x="20" y="30" font-size="16" fill="white" font-weight="bold">Odoo</text>
  <text x="80" y="30" font-size="13" fill="rgba(255,255,255,0.8)">WhatsApp ▸ Configuration ▸ Channels ▸ New</text>

  <!-- Breadcrumb bar -->
  <rect y="48" width="900" height="36" fill="white"/>
  <text x="20" y="72" font-size="13" fill="#875A7B" font-weight="bold">New Channel</text>
  <rect x="760" y="56" width="110" height="28" rx="4" fill="#25D366"/>
  <text x="815" y="75" font-size="13" fill="white" text-anchor="middle" font-weight="bold">💾 Save</text>

  <!-- Form card -->
  <rect x="20" y="94" width="860" height="400" rx="8" fill="white" filter="url(#shadow)"/>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/></filter></defs>

  <!-- Form header -->
  <rect x="20" y="94" width="860" height="48" rx="8" fill="#f8f9fa"/>
  <rect x="20" y="118" width="860" height="24" fill="#f8f9fa"/>
  <text x="40" y="125" font-size="14" fill="#075E54" font-weight="bold">📋 Channel Configuration</text>

  <!-- Status badge -->
  <rect x="780" y="102" width="80" height="24" rx="12" fill="#fff3cd"/>
  <text x="820" y="118" font-size="11" fill="#856404" text-anchor="middle">● Draft</text>

  <!-- Field: Name -->
  <text x="40" y="170" font-size="12" fill="#667781" font-weight="600">Channel Name *</text>
  <rect x="40" y="178" width="340" height="36" rx="4" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="52" y="200" font-size="13" fill="#333">WhatsApp Main Line</text>

  <!-- Field: API Base URL -->
  <text x="420" y="170" font-size="12" fill="#667781" font-weight="600">API Base URL *</text>
  <rect x="420" y="178" width="440" height="36" rx="4" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="432" y="200" font-size="13" fill="#333">https://gate.whapi.cloud</text>

  <!-- Field: API Token -->
  <text x="40" y="238" font-size="12" fill="#667781" font-weight="600">API Token *</text>
  <rect x="40" y="246" width="820" height="36" rx="4" fill="#fff8e1" stroke="#f0c040" stroke-width="1.5"/>
  <text x="52" y="268" font-size="13" fill="#333">BIdaZZimJdGy••••••••••••••••••••••••••••••</text>
  <text x="820" y="268" font-size="11" fill="#25D366" text-anchor="end">👁 Show</text>

  <!-- Field: Webhook Secret -->
  <text x="40" y="306" font-size="12" fill="#667781" font-weight="600">Webhook Secret (auto-generated)</text>
  <rect x="40" y="314" width="820" height="36" rx="4" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="52" y="336" font-size="13" fill="#aaa">3f7a2c19-b841-4e2d-9f3c-••••••••</text>

  <!-- Field: Allowed Users -->
  <text x="40" y="374" font-size="12" fill="#667781" font-weight="600">Allowed Users</text>
  <rect x="40" y="382" width="820" height="36" rx="4" fill="white" stroke="#ddd" stroke-width="1"/>
  <rect x="48" y="388" width="80" height="22" rx="11" fill="#e8f5e9"/>
  <text x="88" y="403" font-size="11" fill="#2e7d32" text-anchor="middle">Ahmed O. ✕</text>
  <rect x="138" y="388" width="72" height="22" rx="11" fill="#e8f5e9"/>
  <text x="174" y="403" font-size="11" fill="#2e7d32" text-anchor="middle">Admin ✕</text>
  <text x="222" y="403" font-size="12" fill="#aaa">+ Add...</text>

  <!-- Action buttons -->
  <rect x="40" y="436" width="160" height="34" rx="4" fill="#075E54"/>
  <text x="120" y="457" font-size="13" fill="white" text-anchor="middle">🔗 Check Health</text>
  <rect x="214" y="436" width="160" height="34" rx="4" fill="#128C7E"/>
  <text x="294" y="457" font-size="13" fill="white" text-anchor="middle">👤 Sync Profile</text>
  <rect x="388" y="436" width="160" height="34" rx="4" fill="#25D366"/>
  <text x="468" y="457" font-size="13" fill="white" text-anchor="middle">⚡ Register Webhook</text>
  <rect x="562" y="436" width="130" height="34" rx="4" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="627" y="457" font-size="13" fill="#333" text-anchor="middle">📱 QR Login</text>

  <!-- Step label -->
  <rect x="20" y="500" width="860" height="20" rx="4" fill="#e8f5e9"/>
  <text x="450" y="514" font-size="11" fill="#2e7d32" text-anchor="middle">STEP 1 — Go to WhatsApp › Configuration › Channels › New · Enter name and paste your Whapi.Cloud API Token · Click Save</text>
</svg>
