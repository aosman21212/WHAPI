<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#075E54"/>
      <stop offset="100%" style="stop-color:#128C7E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#f0f2f5" rx="10"/>

  <!-- Top nav bar -->
  <rect width="900" height="56" fill="url(#headerGrad)" rx="10"/>
  <rect y="46" width="900" height="10" fill="url(#headerGrad)"/>

  <!-- WhatsApp icon in nav -->
  <circle cx="38" cy="28" r="16" fill="#25D366"/>
  <text x="38" y="33" font-family="Arial" font-size="16" fill="white" text-anchor="middle">💬</text>
  <text x="68" y="34" font-family="Arial" font-size="16" fill="white" font-weight="bold">WhatsApp Inbox</text>

  <!-- Nav items -->
  <text x="650" y="34" font-family="Arial" font-size="13" fill="rgba(255,255,255,0.8)">Channels</text>
  <text x="720" y="34" font-family="Arial" font-size="13" fill="rgba(255,255,255,0.8)">Messages</text>
  <text x="798" y="34" font-family="Arial" font-size="13" fill="rgba(255,255,255,0.8)">Contacts</text>

  <!-- LEFT PANEL - Chat list -->
  <rect x="0" y="56" width="280" height="504" fill="white"/>
  <rect x="0" y="56" width="280" height="504" fill="#f8f9fa"/>

  <!-- Search bar -->
  <rect x="10" y="66" width="260" height="36" rx="18" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="32" y="89" font-family="Arial" font-size="13" fill="#999">🔍 Search chats...</text>

  <!-- Chat items -->
  <!-- Chat 1 - active -->
  <rect x="0" y="110" width="280" height="68" fill="#e8f5e9"/>
  <circle cx="34" cy="144" r="20" fill="#25D366"/>
  <text x="34" y="149" font-family="Arial" font-size="13" fill="white" text-anchor="middle">AH</text>
  <text x="64" y="135" font-family="Arial" font-size="14" fill="#111" font-weight="bold">Ahmed Hassan</text>
  <text x="64" y="153" font-family="Arial" font-size="12" fill="#667781">Hello, I need help with my order...</text>
  <text x="240" y="131" font-family="Arial" font-size="11" fill="#667781">10:24</text>
  <circle cx="264" cy="150" r="10" fill="#25D366"/>
  <text x="264" y="155" font-family="Arial" font-size="11" fill="white" text-anchor="middle">3</text>

  <!-- Chat 2 -->
  <rect x="0" y="178" width="280" height="68" fill="white"/>
  <line x1="64" y1="246" x2="270" y2="246" stroke="#f0f0f0" stroke-width="1"/>
  <circle cx="34" cy="212" r="20" fill="#128C7E"/>
  <text x="34" y="217" font-family="Arial" font-size="13" fill="white" text-anchor="middle">SA</text>
  <text x="64" y="203" font-family="Arial" font-size="14" fill="#111" font-weight="bold">Sara Al-Amin</text>
  <text x="64" y="221" font-family="Arial" font-size="12" fill="#667781">Thank you for the quick reply!</text>
  <text x="240" y="199" font-family="Arial" font-size="11" fill="#667781">09:15</text>

  <!-- Chat 3 -->
  <rect x="0" y="246" width="280" height="68" fill="white"/>
  <line x1="64" y1="314" x2="270" y2="314" stroke="#f0f0f0" stroke-width="1"/>
  <circle cx="34" cy="280" r="20" fill="#34B7F1"/>
  <text x="34" y="285" font-family="Arial" font-size="13" fill="white" text-anchor="middle">MK</text>
  <text x="64" y="271" font-family="Arial" font-size="14" fill="#111" font-weight="bold">Mohamed Khalid</text>
  <text x="64" y="289" font-family="Arial" font-size="12" fill="#667781">📎 Invoice_2024.pdf</text>
  <text x="240" y="267" font-family="Arial" font-size="11" fill="#667781">Yesterday</text>

  <!-- Chat 4 -->
  <rect x="0" y="314" width="280" height="68" fill="white"/>
  <line x1="64" y1="382" x2="270" y2="382" stroke="#f0f0f0" stroke-width="1"/>
  <circle cx="34" cy="348" r="20" fill="#DCF8C6" stroke="#25D366" stroke-width="1"/>
  <text x="34" y="353" font-family="Arial" font-size="11" fill="#128C7E" text-anchor="middle">GRP</text>
  <text x="64" y="339" font-family="Arial" font-size="14" fill="#111" font-weight="bold">Sales Team Group</text>
  <text x="64" y="357" font-family="Arial" font-size="12" fill="#667781">Ali: Meeting at 3pm today</text>
  <text x="240" y="335" font-family="Arial" font-size="11" fill="#667781">Mon</text>

  <!-- RIGHT PANEL - Chat messages -->
  <rect x="280" y="56" width="620" height="504" fill="#efeae2"/>

  <!-- Chat wallpaper pattern -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1" fill="#d4cfc8" opacity="0.5"/>
  </pattern>
  <rect x="280" y="56" width="620" height="504" fill="url(#dots)"/>

  <!-- Chat header -->
  <rect x="280" y="56" width="620" height="60" fill="white"/>
  <circle cx="316" cy="86" r="20" fill="#25D366"/>
  <text x="316" y="91" font-family="Arial" font-size="13" fill="white" text-anchor="middle">AH</text>
  <text x="346" y="80" font-family="Arial" font-size="15" fill="#111" font-weight="bold">Ahmed Hassan</text>
  <text x="346" y="97" font-family="Arial" font-size="12" fill="#667781">+966 50 123 4567 · online</text>
  <!-- Action icons -->
  <text x="820" y="91" font-family="Arial" font-size="18" fill="#667781">📞</text>
  <text x="858" y="91" font-family="Arial" font-size="18" fill="#667781">⋮</text>

  <!-- Messages -->
  <!-- Incoming message 1 -->
  <rect x="296" y="132" width="280" height="54" rx="8" fill="white"/>
  <rect x="296" y="132" width="8" height="54" rx="4" fill="#25D366"/>
  <text x="314" y="153" font-family="Arial" font-size="13" fill="#111">Hello, I need help with my order</text>
  <text x="314" y="171" font-family="Arial" font-size="12" fill="#667781">#ORD-2024-001. Can you check?</text>
  <text x="545" y="178" font-family="Arial" font-size="11" fill="#999">10:20</text>

  <!-- Outgoing message 1 -->
  <rect x="546" y="202" width="320" height="54" rx="8" fill="#DCF8C6"/>
  <text x="562" y="223" font-family="Arial" font-size="13" fill="#111">Hello Ahmed! Let me check that</text>
  <text x="562" y="241" font-family="Arial" font-size="12" fill="#667781">order for you right away.</text>
  <text x="825" y="248" font-family="Arial" font-size="11" fill="#999">10:22</text>
  <text x="840" y="248" font-family="Arial" font-size="11" fill="#34B7F1">✓✓</text>

  <!-- Incoming message 2 -->
  <rect x="296" y="272" width="220" height="38" rx="8" fill="white"/>
  <text x="314" y="296" font-family="Arial" font-size="13" fill="#111">Thank you so much! 🙏</text>
  <text x="480" y="302" font-family="Arial" font-size="11" fill="#999">10:24</text>

  <!-- Outgoing message 2 -->
  <rect x="546" y="326" width="320" height="54" rx="8" fill="#DCF8C6"/>
  <text x="562" y="347" font-family="Arial" font-size="13" fill="#111">Your order is confirmed and will be</text>
  <text x="562" y="365" font-family="Arial" font-size="12" fill="#667781">shipped within 2 business days.</text>
  <text x="825" y="372" font-family="Arial" font-size="11" fill="#999">10:25</text>
  <text x="840" y="372" font-family="Arial" font-size="11" fill="#34B7F1">✓✓</text>

  <!-- Message input bar -->
  <rect x="280" y="496" width="620" height="64" fill="white"/>
  <rect x="296" y="508" width="518" height="40" rx="20" fill="#f0f2f5"/>
  <text x="318" y="533" font-family="Arial" font-size="13" fill="#999">Type a message...</text>
  <text x="790" y="534" font-family="Arial" font-size="18" fill="#667781">😊</text>
  <text x="818" y="534" font-family="Arial" font-size="18" fill="#667781">📎</text>
  <circle cx="868" cy="528" r="20" fill="#25D366"/>
  <text x="868" y="534" font-family="Arial" font-size="16" fill="white" text-anchor="middle">➤</text>
</svg>
