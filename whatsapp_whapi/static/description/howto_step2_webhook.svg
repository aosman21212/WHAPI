<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial,sans-serif">
  <rect width="900" height="520" fill="#f0f2f5"/>

  <!-- Split layout: Odoo left, Whapi dashboard right -->

  <!-- LEFT PANEL — Odoo Webhook URL -->
  <rect x="10" y="10" width="430" height="500" rx="8" fill="white" filter="url(#s)"/>
  <defs><filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.09"/></filter></defs>

  <rect x="10" y="10" width="430" height="44" rx="8" fill="#875A7B"/>
  <text x="30" y="38" font-size="14" fill="white" font-weight="bold">Odoo — Channel Form</text>

  <text x="30" y="80" font-size="12" fill="#667781" font-weight="600">Channel Name</text>
  <rect x="30" y="88" width="390" height="32" rx="4" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="44" y="108" font-size="13" fill="#333">WhatsApp Main Line</text>

  <text x="30" y="142" font-size="12" fill="#667781" font-weight="600">Connection Status</text>
  <rect x="30" y="150" width="120" height="28" rx="14" fill="#d4edda"/>
  <text x="90" y="168" font-size="12" fill="#155724" text-anchor="middle" font-weight="bold">✅ Connected</text>

  <text x="30" y="210" font-size="12" fill="#667781" font-weight="600">📋 Your Webhook URL (copy this)</text>
  <rect x="30" y="218" width="390" height="52" rx="4" fill="#e8f5e9" stroke="#25D366" stroke-width="2"/>
  <text x="44" y="238" font-size="10" fill="#075E54" font-weight="bold">https://your-odoo.com/whatsapp/whapi/</text>
  <text x="44" y="254" font-size="10" fill="#075E54" font-weight="bold">webhook/3f7a2c19-b841-4e2d-9f3c-abcd1234</text>
  <rect x="368" y="224" width="44" height="24" rx="4" fill="#25D366"/>
  <text x="390" y="240" font-size="10" fill="white" text-anchor="middle">📋 Copy</text>

  <rect x="30" y="286" width="200" height="32" rx="4" fill="#25D366"/>
  <text x="130" y="306" font-size="13" fill="white" text-anchor="middle" font-weight="bold">⚡ Register Webhook</text>

  <rect x="244" y="286" width="176" height="32" rx="4" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="332" y="306" font-size="13" fill="#333" text-anchor="middle">🔔 Test Webhook</text>

  <!-- Arrow indicator -->
  <text x="30" y="356" font-size="12" fill="#667781">① Click <strong style="color:#25D366">Register Webhook</strong> to auto-register</text>
  <text x="30" y="376" font-size="12" fill="#667781">② Or copy URL and paste manually in Whapi</text>
  <text x="30" y="396" font-size="12" fill="#667781">③ Click <strong>Test Webhook</strong> to verify delivery</text>

  <rect x="30" y="420" width="390" height="68" rx="6" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="44" y="442" font-size="12" fill="#856404" font-weight="bold">⚠️ Webhook receives incoming messages</text>
  <text x="44" y="460" font-size="11" fill="#856404">Make sure your Odoo URL is publicly accessible</text>
  <text x="44" y="476" font-size="11" fill="#856404">so Whapi.Cloud can reach it from the internet.</text>

  <!-- Arrow between panels -->
  <text x="452" y="270" font-size="32" fill="#25D366">⇄</text>

  <!-- RIGHT PANEL — Whapi Dashboard -->
  <rect x="470" y="10" width="420" height="500" rx="8" fill="white" filter="url(#s)"/>
  <rect x="470" y="10" width="420" height="44" rx="8" fill="#128C7E"/>
  <text x="490" y="38" font-size="14" fill="white" font-weight="bold">Whapi.Cloud Dashboard</text>

  <rect x="490" y="66" width="380" height="30" rx="4" fill="#f0f2f5"/>
  <text x="504" y="85" font-size="12" fill="#555">🏠 Dashboard  |  📱 Instances  |  ⚙️ Settings</text>

  <text x="490" y="120" font-size="13" fill="#333" font-weight="bold">Instance: My WhatsApp</text>
  <rect x="490" y="130" width="80" height="22" rx="11" fill="#d4edda"/>
  <text x="530" y="145" font-size="11" fill="#155724" text-anchor="middle">● Active</text>

  <rect x="490" y="164" width="380" height="1" fill="#eee"/>

  <text x="490" y="184" font-size="12" fill="#667781" font-weight="600">Webhook URL</text>
  <rect x="490" y="192" width="380" height="40" rx="4" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="504" y="208" font-size="9" fill="#333">https://your-odoo.com/whatsapp/whapi/</text>
  <text x="504" y="222" font-size="9" fill="#333">webhook/3f7a2c19-b841-4e2d-9f3c-abcd1234</text>

  <text x="490" y="256" font-size="12" fill="#667781" font-weight="600">Webhook Events to Enable</text>
  <rect x="490" y="264" width="380" height="130" rx="4" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="506" y="286" font-size="12" fill="#333">☑ messages — incoming messages</text>
  <text x="506" y="306" font-size="12" fill="#333">☑ statuses — delivery receipts</text>
  <text x="506" y="326" font-size="12" fill="#333">☑ chats — chat list updates</text>
  <text x="506" y="346" font-size="12" fill="#333">☑ contacts — contact sync</text>
  <text x="506" y="366" font-size="12" fill="#333">☑ groups — group updates</text>
  <text x="506" y="386" font-size="12" fill="#333">☑ presences — online status</text>

  <rect x="490" y="408" width="180" height="32" rx="4" fill="#128C7E"/>
  <text x="580" y="428" font-size="13" fill="white" text-anchor="middle" font-weight="bold">💾 Save Settings</text>

  <!-- Step label -->
  <rect x="10" y="505" width="880" height="14" rx="4" fill="#e8f5e9"/>
  <text x="450" y="515" font-size="10" fill="#2e7d32" text-anchor="middle">STEP 2 — Copy Webhook URL from Odoo › Paste into Whapi.Cloud Dashboard › Enable all events › Save</text>
</svg>
