<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#075E54"/>
      <stop offset="100%" style="stop-color:#128C7E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#f0f2f5" rx="10"/>

  <!-- Top nav -->
  <rect width="900" height="56" fill="url(#hdr)" rx="10"/>
  <rect y="46" width="900" height="10" fill="url(#hdr)"/>
  <circle cx="38" cy="28" r="16" fill="#25D366"/>
  <text x="38" y="33" font-family="Arial" font-size="14" fill="white" text-anchor="middle">💬</text>
  <text x="68" y="34" font-family="Arial" font-size="16" fill="white" font-weight="bold">WhatsApp → Configuration → Channels</text>
  <rect x="800" y="16" width="90" height="24" rx="4" fill="#25D366"/>
  <text x="845" y="32" font-family="Arial" font-size="12" fill="white" text-anchor="middle">+ New Channel</text>

  <!-- White content area -->
  <rect x="16" y="72" width="868" height="392" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Table header -->
  <rect x="16" y="72" width="868" height="44" rx="8" fill="#f8f9fa"/>
  <rect x="16" y="100" width="868" height="16" fill="#f8f9fa"/>
  <text x="36" y="99" font-family="Arial" font-size="13" fill="#666" font-weight="bold">Name</text>
  <text x="230" y="99" font-family="Arial" font-size="13" fill="#666" font-weight="bold">Token (API Key)</text>
  <text x="520" y="99" font-family="Arial" font-size="13" fill="#666" font-weight="bold">Webhook URL</text>
  <text x="760" y="99" font-family="Arial" font-size="13" fill="#666" font-weight="bold">Status</text>

  <!-- Row 1 -->
  <rect x="16" y="116" width="868" height="56" fill="white"/>
  <line x1="16" y1="172" x2="884" y2="172" stroke="#f0f0f0" stroke-width="1"/>
  <!-- Channel name with icon -->
  <circle cx="52" cy="144" r="18" fill="#25D366"/>
  <text x="52" y="149" font-family="Arial" font-size="12" fill="white" text-anchor="middle">📱</text>
  <text x="80" y="149" font-family="Arial" font-size="14" fill="#111" font-weight="bold">Main Sales Channel</text>
  <!-- Token (masked) -->
  <rect x="230" y="132" width="260" height="26" rx="4" fill="#f8f9fa"/>
  <text x="244" y="149" font-family="Arial" font-size="12" fill="#667781" font-family="monospace">wh_••••••••••••••••••••••</text>
  <!-- Webhook URL -->
  <rect x="520" y="132" width="220" height="26" rx="4" fill="#e8f5e9"/>
  <text x="534" y="149" font-family="Arial" font-size="11" fill="#128C7E">https://myodoo.com/whapi/</text>
  <!-- Status badge -->
  <rect x="760" y="132" width="72" height="24" rx="12" fill="#e8f5e9"/>
  <circle cx="774" cy="144" r="5" fill="#25D366"/>
  <text x="782" y="149" font-family="Arial" font-size="12" fill="#25D366" font-weight="bold">Connected</text>

  <!-- Row 2 -->
  <rect x="16" y="172" width="868" height="56" fill="white"/>
  <line x1="16" y1="228" x2="884" y2="228" stroke="#f0f0f0" stroke-width="1"/>
  <circle cx="52" cy="200" r="18" fill="#128C7E"/>
  <text x="52" y="205" font-family="Arial" font-size="12" fill="white" text-anchor="middle">💼</text>
  <text x="80" y="205" font-family="Arial" font-size="14" fill="#111" font-weight="bold">Support Channel</text>
  <rect x="230" y="188" width="260" height="26" rx="4" fill="#f8f9fa"/>
  <text x="244" y="205" font-family="Arial" font-size="12" fill="#667781" font-family="monospace">wh_••••••••••••••••••••••</text>
  <rect x="520" y="188" width="220" height="26" rx="4" fill="#e8f5e9"/>
  <text x="534" y="205" font-family="Arial" font-size="11" fill="#128C7E">https://myodoo.com/whapi/</text>
  <rect x="760" y="188" width="72" height="24" rx="12" fill="#e8f5e9"/>
  <circle cx="774" cy="200" r="5" fill="#25D366"/>
  <text x="782" y="205" font-family="Arial" font-size="12" fill="#25D366" font-weight="bold">Connected</text>

  <!-- Row 3 -->
  <rect x="16" y="228" width="868" height="56" fill="white"/>
  <line x1="16" y1="284" x2="884" y2="284" stroke="#f0f0f0" stroke-width="1"/>
  <circle cx="52" cy="256" r="18" fill="#34B7F1"/>
  <text x="52" y="261" font-family="Arial" font-size="12" fill="white" text-anchor="middle">🛍️</text>
  <text x="80" y="261" font-family="Arial" font-size="14" fill="#111" font-weight="bold">Marketing Channel</text>
  <rect x="230" y="244" width="260" height="26" rx="4" fill="#f8f9fa"/>
  <text x="244" y="261" font-family="Arial" font-size="12" fill="#667781" font-family="monospace">wh_••••••••••••••••••••••</text>
  <rect x="520" y="244" width="220" height="26" rx="4" fill="#fff3e0"/>
  <text x="534" y="261" font-family="Arial" font-size="11" fill="#f57c00">Configure webhook first</text>
  <rect x="760" y="244" width="72" height="24" rx="12" fill="#fff3e0"/>
  <circle cx="774" cy="256" r="5" fill="#ff9800"/>
  <text x="782" y="261" font-family="Arial" font-size="12" fill="#ff9800" font-weight="bold">Pending</text>

  <!-- Channel form section below -->
  <rect x="16" y="300" width="868" height="164" rx="0" fill="#f8f9fa"/>
  <text x="36" y="326" font-family="Arial" font-size="14" fill="#075E54" font-weight="bold">Channel Configuration</text>
  <!-- Form fields -->
  <text x="36" y="355" font-family="Arial" font-size="12" fill="#666">Channel Name</text>
  <rect x="170" y="341" width="220" height="28" rx="4" fill="white" stroke="#d0d0d0" stroke-width="1"/>
  <text x="182" y="360" font-family="Arial" font-size="13" fill="#333">Main Sales Channel</text>

  <text x="420" y="355" font-family="Arial" font-size="12" fill="#666">Whapi API Token</text>
  <rect x="540" y="341" width="320" height="28" rx="4" fill="white" stroke="#d0d0d0" stroke-width="1"/>
  <text x="552" y="360" font-family="Arial" font-size="13" fill="#333">wh_xxxxxxxxxxxxxxxxxxxxxxxx</text>

  <text x="36" y="398" font-family="Arial" font-size="12" fill="#666">Webhook Secret</text>
  <rect x="170" y="384" width="220" height="28" rx="4" fill="white" stroke="#d0d0d0" stroke-width="1"/>
  <text x="182" y="403" font-family="Arial" font-size="13" fill="#999">Optional</text>

  <text x="420" y="398" font-family="Arial" font-size="12" fill="#666">Assigned Users</text>
  <rect x="540" y="384" width="180" height="28" rx="4" fill="white" stroke="#d0d0d0" stroke-width="1"/>
  <text x="552" y="403" font-family="Arial" font-size="13" fill="#333">Admin, Sales Team</text>

  <!-- Save button -->
  <rect x="770" y="432" width="110" height="32" rx="4" fill="#075E54"/>
  <text x="825" y="452" font-family="Arial" font-size="13" fill="white" text-anchor="middle">Save &amp; Test</text>
</svg>
