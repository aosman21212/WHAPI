<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial,sans-serif">
  <rect width="900" height="560" fill="#f0f2f5"/>
  <defs><filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/></filter></defs>

  <!-- Top navbar -->
  <rect width="900" height="48" fill="#875A7B"/>
  <text x="20" y="30" font-size="16" fill="white" font-weight="bold">Odoo</text>
  <text x="80" y="30" font-size="13" fill="rgba(255,255,255,0.8)">WhatsApp ▸ Inbox</text>

  <!-- Channel selector bar -->
  <rect y="48" width="900" height="40" fill="white" filter="url(#sh)"/>
  <text x="20" y="72" font-size="12" fill="#667781">Channel:</text>
  <rect x="78" y="54" width="200" height="28" rx="4" fill="white" stroke="#25D366" stroke-width="2"/>
  <text x="90" y="72" font-size="12" fill="#333">📱 WhatsApp Main Line ▼</text>
  <rect x="298" y="54" width="100" height="28" rx="4" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="348" y="72" font-size="12" fill="#333" text-anchor="middle">🔄 Refresh</text>

  <!-- Left panel: Chat list -->
  <rect x="10" y="98" width="250" height="452" rx="8" fill="white" filter="url(#sh)"/>
  <rect x="10" y="98" width="250" height="44" rx="8" fill="#075E54"/>
  <text x="30" y="125" font-size="13" fill="white" font-weight="bold">💬 Chats (20)</text>

  <!-- Search box -->
  <rect x="18" y="150" width="234" height="30" rx="15" fill="#f0f2f5"/>
  <text x="36" y="169" font-size="12" fill="#aaa">🔍 Search chats...</text>

  <!-- Chat items -->
  <!-- Chat 1 (selected) -->
  <rect x="10" y="188" width="250" height="64" fill="#e8f5e9"/>
  <rect x="18" y="198" width="40" height="40" rx="20" fill="#128C7E"/>
  <text x="38" y="223" font-size="16" fill="white" text-anchor="middle">A</text>
  <text x="66" y="212" font-size="13" fill="#111" font-weight="bold">Ahmed Hassan</text>
  <text x="66" y="228" font-size="11" fill="#667781">Hello! Is the order ready?</text>
  <text x="224" y="210" font-size="10" fill="#667781" text-anchor="end">10:32</text>
  <rect x="224" y="218" width="20" height="20" rx="10" fill="#25D366"/>
  <text x="234" y="232" font-size="10" fill="white" text-anchor="middle">3</text>

  <!-- Chat 2 -->
  <rect x="10" y="252" width="250" height="64" fill="white"/>
  <rect x="10" y="315" width="250" height="1" fill="#f0f0f0"/>
  <rect x="18" y="262" width="40" height="40" rx="20" fill="#25D366"/>
  <text x="38" y="287" font-size="16" fill="white" text-anchor="middle">S</text>
  <text x="66" y="276" font-size="13" fill="#111" font-weight="bold">Sara Al-Rashid</text>
  <text x="66" y="292" font-size="11" fill="#667781">✓✓ Thanks for the quick reply!</text>
  <text x="234" y="274" font-size="10" fill="#667781" text-anchor="end">09:14</text>

  <!-- Chat 3 -->
  <rect x="10" y="316" width="250" height="64" fill="white"/>
  <rect x="10" y="379" width="250" height="1" fill="#f0f0f0"/>
  <rect x="18" y="326" width="40" height="40" rx="20" fill="#e17055"/>
  <text x="38" y="351" font-size="16" fill="white" text-anchor="middle">M</text>
  <text x="66" y="340" font-size="13" fill="#111" font-weight="bold">Mohamed Khalid</text>
  <text x="66" y="356" font-size="11" fill="#667781">📎 Invoice_Q4.pdf</text>
  <text x="234" y="338" font-size="10" fill="#667781" text-anchor="end">Yesterday</text>

  <!-- Chat 4 -->
  <rect x="10" y="380" width="250" height="64" fill="white"/>
  <rect x="10" y="443" width="250" height="1" fill="#f0f0f0"/>
  <rect x="18" y="390" width="40" height="40" rx="20" fill="#6c5ce7"/>
  <text x="38" y="415" font-size="16" fill="white" text-anchor="middle">F</text>
  <text x="66" y="404" font-size="13" fill="#111" font-weight="bold">Fatima Sales Team</text>
  <text x="66" y="420" font-size="11" fill="#667781">🌍 Location shared</text>
  <text x="234" y="402" font-size="10" fill="#667781" text-anchor="end">Mon</text>

  <!-- Chat 5 -->
  <rect x="10" y="444" width="250" height="64" fill="white"/>
  <rect x="18" y="454" width="40" height="40" rx="20" fill="#fdcb6e"/>
  <text x="38" y="479" font-size="15" fill="#333" text-anchor="middle">K</text>
  <text x="66" y="468" font-size="13" fill="#111" font-weight="bold">Khalid Al-Zahrani</text>
  <text x="66" y="484" font-size="11" fill="#667781">When can we meet?</text>
  <text x="234" y="466" font-size="10" fill="#667781" text-anchor="end">Sun</text>

  <!-- Right panel: Conversation -->
  <rect x="270" y="98" width="620" height="452" rx="8" fill="#ECE5DD" filter="url(#sh)"/>

  <!-- Conversation header -->
  <rect x="270" y="98" width="620" height="52" rx="8" fill="white"/>
  <rect x="270" y="130" width="620" height="20" fill="white"/>
  <rect x="280" y="108" width="36" height="36" rx="18" fill="#128C7E"/>
  <text x="298" y="131" font-size="14" fill="white" text-anchor="middle">A</text>
  <text x="326" y="122" font-size="14" fill="#111" font-weight="bold">Ahmed Hassan</text>
  <text x="326" y="138" font-size="11" fill="#667781">+966 55 336 8212 · last seen today at 10:32</text>
  <text x="868" y="128" font-size="18" fill="#667781" text-anchor="end">⋮</text>

  <!-- Messages -->
  <!-- Received message -->
  <rect x="282" y="164" width="280" height="42" rx="8" fill="white"/>
  <rect x="282" y="164" width="6" height="42" rx="3" fill="#25D366"/>
  <text x="298" y="180" font-size="12" fill="#333">Hello! Is the order ready?</text>
  <text x="298" y="198" font-size="10" fill="#999">10:28 ✓</text>
  <!-- timestamp -->
  <rect x="372" y="155" width="116" height="18" rx="9" fill="rgba(0,0,0,0.1)"/>
  <text x="430" y="167" font-size="10" fill="#555" text-anchor="middle">Today</text>

  <!-- Sent message -->
  <rect x="548" y="220" width="330" height="54" rx="8" fill="#DCF8C6"/>
  <text x="564" y="238" font-size="12" fill="#333">Yes! Your order #SO-1042 is packed</text>
  <text x="564" y="256" font-size="12" fill="#333">and ready for pickup 📦</text>
  <text x="866" y="266" font-size="10" fill="#999" text-anchor="end">10:29 ✓✓</text>

  <!-- Received message 2 -->
  <rect x="282" y="290" width="220" height="32" rx="8" fill="white"/>
  <text x="298" y="310" font-size="12" fill="#333">Great! I'll be there by 2pm</text>
  <text x="486" y="315" font-size="10" fill="#999" text-anchor="end">10:32 ✓</text>

  <!-- Received message 3 - image placeholder -->
  <rect x="282" y="335" width="200" height="130" rx="8" fill="white"/>
  <rect x="282" y="335" width="200" height="110" rx="8" fill="#b2dfdb"/>
  <text x="382" y="396" font-size="30" text-anchor="middle">🖼️</text>
  <text x="382" y="422" font-size="10" fill="#666" text-anchor="middle">order_photo.jpg</text>
  <text x="298" y="458" font-size="10" fill="#999">10:33 ✓</text>

  <!-- Message composer -->
  <rect x="270" y="488" width="620" height="62" fill="white"/>
  <rect x="282" y="498" width="506" height="38" rx="19" fill="#f0f2f5"/>
  <text x="308" y="521" font-size="12" fill="#aaa">Type a message...</text>
  <rect x="800" y="498" width="38" height="38" rx="19" fill="#25D366"/>
  <text x="819" y="522" font-size="18" fill="white" text-anchor="middle">➤</text>
  <text x="290" y="521" font-size="16" fill="#667781">📎</text>

  <!-- Step label -->
  <rect x="10" y="540" width="880" height="16" rx="4" fill="#e8f5e9"/>
  <text x="450" y="552" font-size="11" fill="#2e7d32" text-anchor="middle">STEP 3 — Go to WhatsApp › Chats to see your inbox · Click a chat to open it · Type and press Enter or ➤ to send</text>
</svg>
